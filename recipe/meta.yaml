{% set name = "torchapp" %}
{% set version = "0.5.10" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/torchapp-{{ version }}.tar.gz
  sha256: f6b4ec75f45fa7d431f4e1e25be291f499f8af92d196afea19a304e17f288a11

build:
  entry_points:
    - torchapp-generator = torchapp.generator:app
    - torchapp-imageclassifier = torchapp.examples.image_classifier:ImageClassifier.main
    - torchapp-imageclassifier-tools = torchapp.examples.image_classifier:ImageClassifier.tools
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=2.0.0,<3.0.0
    - pip
  run:
    - python >={{ python_min }},<3.15
    - pytorch >=1.12.1
    - torchvision >=0.13.0
    - lightning >=2.3.3,!=2.6.2,!=2.6.3
    - numpy >=1.22.0
    - executing >=2.0.1
    - typer >=0.4.0
    - rich >=10.16.1
    - pandas >=1.3.5
    - wandb >=0.12.9
    - cookiecutter >=2.1.1
    - scikit-learn >=1.0.2
    - pillow >=9.0.1
    - pyyaml >=6.0
    - pybtex >=0.24.0
    - pyjwt >=2.4.0
    - optuna >=2.10.0
    - pybtexnbib >=0.1.1
    - scikit-optimize >=0.9.0
    - scipy >=1.9.1
    - appdirs >=1.4.4
    - cmaes >=0.11.1
    # grokadamw is not on conda-forge. It is only imported when the --grokadamw option is used.

test:
  imports:
    - torchapp
  commands:
    - torchapp-generator --help
    - torchapp-imageclassifier --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/rbturnbull/torchapp
  summary: A wrapper for PyTorch projects to create easy command-line interfaces and manage hyper-parameter tuning.
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://rbturnbull.github.io/torchapp/
  dev_url: https://github.com/rbturnbull/torchapp

extra:
  recipe-maintainers:
    - rbturnbull
    - vinisalazar
